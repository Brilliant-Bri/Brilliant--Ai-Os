<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scene Builder</title>

<style>

body{
margin:0;
min-height:100vh;
background:radial-gradient(circle,#123b66,#050814);
color:white;
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:#65d8ff;
text-shadow:0 0 20px #008cff;
}

.container{
max-width:800px;
margin:auto;
}

.scene{
background:rgba(20,40,80,.5);
border:1px solid #3bcfff;
border-radius:20px;
padding:20px;
margin:20px 0;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
background:#081426;
color:white;
border:1px solid #3bcfff;
border-radius:10px;
}

button{
padding:12px 25px;
border-radius:25px;
border:none;
background:#008cff;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h1>
🎬 Scene Builder
</h1>


<div class="container">

<div class="scene">

<h2>Новая сцена</h2>

<input id="name" placeholder="Название сцены">

<textarea id="description"
placeholder="Описание действия"></textarea>

<textarea id="visual"
placeholder="Визуальный стиль (камера, свет, атмосфера)"></textarea>

<textarea id="voice"
placeholder="Текст диктора или диалог"></textarea>


<button onclick="saveScene()">
Сохранить сцену
</button>

</div>

</div>


<script>

function saveScene(){

let scene={
name:name.value,
description:description.value,
visual:visual.value,
voice:voice.value
};


localStorage.setItem(
"BrilliantScene",
JSON.stringify(scene)
);


alert("Сцена сохранена");

}

</script>


</body>
</html>
