<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brilliant AI Studio</title>

<style>

body{
margin:0;
min-height:100vh;
background:radial-gradient(circle,#123b66,#050814);
color:white;
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:#65d8ff;
text-shadow:0 0 20px #008cff;
}

.panel{
max-width:700px;
margin:auto;
background:rgba(20,40,80,.5);
padding:30px;
border-radius:25px;
box-shadow:0 0 30px #0066ff;
}

input,textarea{
width:100%;
margin:10px 0;
padding:12px;
border-radius:10px;
background:#081426;
color:white;
border:1px solid #3bcfff;
}

button{
padding:15px 30px;
border-radius:30px;
background:#008cff;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<h1>
🎬 Brilliant AI Studio
</h1>

<div class="panel">

<h2>Создать новый эпизод</h2>

<input id="title" placeholder="Название серии">

<input id="season" placeholder="Сезон">

<textarea id="story" placeholder="Описание истории"></textarea>

<textarea id="scenes" placeholder="Список сцен"></textarea>

<input id="voice" placeholder="Голос персонажей">

<input id="music" placeholder="Музыка">

<button onclick="saveEpisode()">
Создать проект
</button>

</div>


<script>

function saveEpisode(){

let episode={
title:title.value,
season:season.value,
story:story.value,
scenes:scenes.value,
voice:voice.value,
music:music.value
};


localStorage.setItem(
"BrilliantEpisode",
JSON.stringify(episode)
);


alert("Эпизод сохранён в Brilliant AI Memory");

}

</script>


</body>
</html>
