<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brilliant AI Studio</title>

<style>

body{
margin:0;
min-height:100vh;
background:radial-gradient(circle,#123b66,#050814);
color:white;
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:#65d8ff;
text-shadow:0 0 20px #008cff;
}

.panel{
max-width:700px;
margin:auto;
background:rgba(20,40,80,.5);
padding:30px;
border-radius:25px;
box-shadow:0 0 30px #0066ff;
}

input,textarea{
width:100%;
box-sizing:border-box;
margin:10px 0;
padding:12px;
border-radius:10px;
background:#081426;
color:white;
border:1px solid #3bcfff;
}

button{
padding:15px 30px;
border-radius:30px;
background:#008cff;
color:white;
border:none;
cursor:pointer;
width:100%;
margin-top:10px;
transition:background 0.3s;
}

button:hover{
background:#0066cc;
}

button:disabled{
background:#555;
cursor:not-allowed;
}

</style>

</head>

<body>

<h1>
🎬 Brilliant AI Studio
</h1>

<div class="panel">

<h2>Создать новый эпизод</h2>

<input id="title" placeholder="Название серии" type="text">

<input id="season" placeholder="Сезон" type="number">

<textarea id="story" placeholder="Описание истории"></textarea>

<textarea id="scenes" placeholder="Список сцен"></textarea>

<input id="voice" placeholder="Голос персонажей" type="text">

<input id="music" placeholder="Музыка" type="text">

<button id="saveBtn" onclick="saveEpisode()">
Создать проект
</button>

</div>


<script>

function saveEpisode(){

// Получаем элементы через getElementById
const titleInput = document.getElementById('title');
const seasonInput = document.getElementById('season');
const storyInput = document.getElementById('story');
const scenesInput = document.getElementById('scenes');
const voiceInput = document.getElementById('voice');
const musicInput = document.getElementById('music');
const saveBtn = document.getElementById('saveBtn');

// Валидация: проверяем заполнены ли обязательные поля
if(!titleInput.value.trim()){
alert("Пожалуйста, введите название серии");
return;
}

if(!storyInput.value.trim()){
alert("Пожалуйста, введите описание истории");
return;
}

// Формируем объект эпизода
let episode={
title: titleInput.value.trim(),
season: seasonInput.value || "1",
story: storyInput.value.trim(),
scenes: scenesInput.value.trim(),
voice: voiceInput.value.trim(),
music: musicInput.value.trim(),
timestamp: new Date().toLocaleString('ru-RU')
};

// Отключаем кнопку
saveBtn.disabled = true;
saveBtn.textContent = "Сохранение...";

try{
// Сохраняем в localStorage
localStorage.setItem(
"BrilliantEpisode",
JSON.stringify(episode)
);

// Очищаем форму
titleInput.value = "";
seasonInput.value = "";
storyInput.value = "";
scenesInput.value = "";
voiceInput.value = "";
musicInput.value = "";

alert("✅ Эпизод успешно сохранён в Brilliant AI Memory");

}catch(error){
alert("❌ Ошибка при сохранении: " + error.message);
console.error(error);
}finally{
// Возвращаем кнопку в исходное состояние
saveBtn.disabled = false;
saveBtn.textContent = "Создать проект";
}

}

</script>


</body>
</html>
