<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brilliant AI Character Studio</title>

<style>

body {
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at center,#123b66,#050814);
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}


h1 {
    text-align:center;
    color:#65d8ff;
    text-shadow:0 0 25px #008cff;
    letter-spacing:5px;
}


.container {
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    margin-top:40px;
}


.character {

background:rgba(20,40,80,.45);

border:1px solid rgba(80,200,255,.5);

border-radius:25px;

padding:30px;

text-align:center;

backdrop-filter:blur(15px);

transition:.4s;

}


.character:hover {

transform:translateY(-10px);

box-shadow:0 0 40px #008cff;

}


.avatar {

font-size:70px;

}


button {

padding:12px 25px;

border-radius:25px;

border:1px solid #3bcfff;

background:transparent;

color:white;

cursor:pointer;

}


button:hover {

background:#008cff;

}


</style>

</head>


<body>


<h1>
🤖 CHARACTER STUDIO
</h1>


<div class="container">


<div class="character">

<div class="avatar">💎</div>

<h2>Brilliant AI</h2>

<p>
Первый цифровой разум.
<br>
Холодная логика.
<br>
Поиск понимания человечества.
</p>

<button>
Edit Character
</button>

</div>



<div class="character">

<div class="avatar">🌌</div>

<h2>Mira</h2>

<p>
Мост между AI и людьми.
<br>
Эмоции.
<br>
Любопытство.
<br>
Понимание жизни.
</p>

<button>
Edit Character
</button>

</div>



<div class="character">

<div class="avatar">➕</div>

<h2>New Character</h2>

<p>
Создать нового героя.
</p>

<button>
Create
</button>

</div>


</div>


</body>
</html>
