<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brilliant AI Studio</title>

<style>

body {
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at center,#123b66,#050814);
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1 {
    text-align:center;
    color:#65d8ff;
    text-shadow:0 0 25px #008cff;
    letter-spacing:5px;
}


.container {
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    margin-top:40px;
}


.card {

background:rgba(20,40,80,.45);

border:
1px solid rgba(80,200,255,.5);

border-radius:25px;

padding:30px;

text-align:center;

backdrop-filter:blur(15px);

transition:.4s;

}


.card:hover {

transform:translateY(-10px);

box-shadow:
0 0 40px #008cff;

}


.icon {

font-size:50px;

}


button {

margin-top:20px;

padding:12px 25px;

border-radius:25px;

border:1px solid #3bcfff;

background:transparent;

color:white;

cursor:pointer;

}


button:hover {

background:#008cff;

}


</style>

</head>


<body>


<h1>
🎨 BRILLIANT AI STUDIO
</h1>


<div class="container">


<div class="card">

<div class="icon">🎨</div>

<h2>Image Generator</h2>

<p>
Upload image<br>
Write prompt<br>
Create artwork
</p>

<button>
Open
</button>

</div>



<div class="card">

<div class="icon">🎬</div>

<h2>Video Generator</h2>

<p>
Upload image<br>
YouTube link<br>
Create video
</p>

<button>
Open
</button>

</div>



<div class="card">

<div class="icon">📚</div>

<h2>Prompt Library</h2>

<p>
Characters<br>
Scenes<br>
Camera<br>
Effects
</p>

<button>
Open
</button>

</div>



<div class="card">

<div class="icon">📁</div>

<h2>My Projects</h2>

<p>
Videos<br>
Images<br>
Stories
</p>

<button>
Open
</button>

</div>


</div>


</body>
</html>
